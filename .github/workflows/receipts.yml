name: Receipts and drift

# Weekly: confirm every receipt still resolves, and report which repos have moved past their pin.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify receipts
        run: npm run check
      - name: Drift report
        run: |
          {
            echo '### Repos vs pinned receipts'
            echo '```'
            npm run --silent drift
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
